<?xml version="1.0"?>
<?xml-stylesheet href="panel.css" type="text/css"?>
<window
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  id="paperflow-panel-window"
  windowtype="paperflow:panel"
  title="PaperFlow"
  width="900"
  height="720"
  persist="screenX screenY width height sizemode">
  <vbox id="pt-window" flex="1">
    <html:div id="pt-root" flex="1">
      <html:header id="pt-header">
        <html:div id="pt-brandrow">
          <html:span id="pt-brand">PaperFlow</html:span>
          <html:span id="pt-status-chip" class="pt-chip pt-chip-missing">missing</html:span>
          <html:span id="pt-chunk-progress" class="pt-chunk"></html:span>
        </html:div>
        <html:h1 id="pt-paper-title">PaperFlow</html:h1>
        <html:p id="pt-status" class="pt-status-line">Panel loaded. Initializing...</html:p>
      </html:header>

      <html:nav id="pt-tabs" aria-label="PaperFlow views">
        <html:button id="pt-tab-summary" type="button" class="pt-tab pt-tab-active">Summary</html:button>
        <html:button id="pt-tab-translation" type="button" class="pt-tab">Translation</html:button>
        <html:button id="pt-tab-meta" type="button" class="pt-tab">Meta</html:button>
      </html:nav>

      <html:div id="pt-main">
        <html:main id="pt-content" class="pt-text-view">
          Loading...
        </html:main>

        <html:div id="pt-divider" class="pt-divider"></html:div>

        <html:section id="pt-chat" aria-label="Gemini Chat">
          <html:div id="pt-chat-log"></html:div>
          <html:div id="pt-chat-attachments"></html:div>
          <html:div id="pt-chat-composer" class="pt-chat-composer">
            <html:textarea id="pt-chat-input" rows="1" placeholder="무엇이든 질문하세요."
              aria-label="무엇이든 질문하세요."></html:textarea>
            <!-- 추천 질문이 천천히 교차되는 오버레이. JS가 켜지면 위 placeholder는 비운다. -->
            <html:div id="pt-composer-hint" class="pt-composer-hint" aria-hidden="true"></html:div>
            <html:div class="pt-composer-actions">
              <html:div class="pt-composer-tools">
                <html:button id="pt-chat-attach" type="button" class="pt-icon-btn"
                  title="내 컴퓨터에서 파일을 선택해 대화에 첨부합니다." aria-label="내 컴퓨터에서 파일을 선택해 대화에 첨부합니다.">+</html:button>
              </html:div>
              <html:button id="pt-chat-send" type="button" class="pt-send-btn" title="Send" aria-label="Send">↑</html:button>
            </html:div>
          </html:div>
        </html:section>
      </html:div>
    </html:div>
  </vbox>
  <script type="application/javascript" src="panel.js"></script>
</window>
