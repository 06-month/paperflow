<?xml version="1.0"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml"
        title="Paper Translator Panel"
        width="720" height="820"
        onload="PTPanel.init()">
  <html:link rel="stylesheet" href="panel.css"/>
  <script src="panel.js"/>
  <vbox flex="1" class="pt-panel-root">
    <hbox align="center" class="pt-toolbar">
      <html:div class="pt-title-wrap">
        <html:div id="pt-panel-title" class="pt-title">Paper Translator</html:div>
        <html:div id="pt-panel-subtitle" class="pt-subtitle">번역본 로드 중...</html:div>
      </html:div>
      <spacer flex="1"/>
      <button label="새로고침" oncommand="PTPanel.reload()"/>
      <button label="HTML 열기" oncommand="PTPanel.openHTML()"/>
    </hbox>

    <tabbox flex="1">
      <tabs>
        <tab label="번역"/>
        <tab label="채팅"/>
        <tab label="메타"/>
      </tabs>
      <tabpanels flex="1">
        <tabpanel flex="1">
          <html:div id="pt-translation-view" class="pt-scroll">로드 중...</html:div>
        </tabpanel>
        <tabpanel flex="1">
          <vbox flex="1" class="pt-chat-box">
            <html:div id="pt-chat-log" class="pt-chat-log">
              <html:div class="pt-msg pt-system">번역 완료된 논문 내용 기준으로 질문할 수 있습니다.</html:div>
            </html:div>
            <hbox class="pt-chat-input-row">
              <html:textarea id="pt-chat-input" class="pt-chat-input" placeholder="예: 이 논문의 핵심 기여를 섹션별로 정리해줘"></html:textarea>
              <button label="질문" oncommand="PTPanel.ask()"/>
            </hbox>
          </vbox>
        </tabpanel>
        <tabpanel flex="1">
          <html:pre id="pt-meta-view" class="pt-scroll pt-meta-view">로드 중...</html:pre>
        </tabpanel>
      </tabpanels>
    </tabbox>
  </vbox>
</window>
